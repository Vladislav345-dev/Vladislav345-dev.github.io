<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <script>
            function greet()
            {
                alert("Привет, " + document.querySelector(#name).value + "!");
            }
        </script>

    </head>
    <body>
        <form onsubmit="greet(); return false;">
            <input type="text" id="name" placeholder="Имя">
            <input type="submit">
        </form>
    </body>
</html>
